services:
  - type: web
    name: sistema
    env: node
    plan: free
    autoDeploy: true
    buildCommand: npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: SESSION_TTL_MINUTES
        value: 30
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 120
      - key: MAX_UPLOAD_MB
        value: 12